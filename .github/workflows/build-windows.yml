name: Build & release NETWATCH.exe

# Every push to main builds NETWATCH.exe and publishes it as release v1.0.<run number>.
# Users update with:  netwatch-update
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller scapy pywebview

      - name: Stamp version
        shell: pwsh
        run: Set-Content netwatch\_version.py "__version__ = `"$env:VERSION`""

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name NETWATCH --icon assets\netwatch.ico
          --add-data "netwatch\static;netwatch\static"
          --collect-submodules scapy
          netwatch_app.py

      - name: Smoke test
        shell: pwsh
        run: |
          python -c "import netwatch.server, netwatch.capture, netwatch.window, webview, scapy.all"
          if (-not (Test-Path dist\NETWATCH.exe)) { throw "NETWATCH.exe missing" }
          "{0:N1} MB" -f ((Get-Item dist\NETWATCH.exe).Length / 1MB)
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs; throw "install.ps1 has syntax errors" }

      - uses: actions/upload-artifact@v4
        with:
          name: NETWATCH-windows
          path: dist/NETWATCH.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ env.VERSION }}" dist/NETWATCH.exe --target "${{ github.sha }}" --title "NETWATCH v${{ env.VERSION }}" --generate-notes --latest

      - name: Test installer / updater end-to-end
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
          $v = (Get-Content "$env:ProgramFiles\NETWATCH\version.txt" -Raw).Trim()
          if ($v -ne "v$env:VERSION") { throw "installed $v, expected v$env:VERSION" }
          if (-not (Test-Path "$env:ProgramFiles\NETWATCH\netwatch-update.cmd")) { throw "netwatch-update.cmd missing" }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 | Out-String
          $out
          if ($out -notmatch 'Sudah versi terbaru') { throw "second run should report up to date" }
