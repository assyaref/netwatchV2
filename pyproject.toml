[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch"
version = "1.0.0"
description = "Office network monitoring terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.5"]

[project.optional-dependencies]
window = ["pywebview>=5"]

[project.scripts]
netwatchv2 = "netwatch.server:main"
netwatchv2-update = "netwatch.updater:main"

[tool.setuptools]
packages = ["netwatch"]

[tool.setuptools.package-data]
netwatch = ["static/*"]
